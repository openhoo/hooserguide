name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run test:package
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-handbook
          path: output/demo
          retention-days: 7

  browsers:
    name: Qualify ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      HOOSERGUIDE_TEST_BROWSER: ${{ matrix.browser }}
      HOOSERGUIDE_BROWSER_ARTIFACTS: output/browser-qualification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: output/browser-qualification
          retention-days: 7
